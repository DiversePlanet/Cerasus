<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cerasus — City Map</title>
<meta name="description" content="Explore Cerasus on the Rulercraft world map.">

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#f5f5f7;
  color:#1d1d1f;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

/* NAV */

.map-nav{
  height:52px;
  padding:0 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;

  position:sticky;
  top:0;
  z-index:100;

  background:rgba(245,245,247,.82);
  backdrop-filter:blur(20px);

  border-bottom:1px solid #ddd;
}

.map-brand{
  font-weight:700;
  letter-spacing:4px;
}

.map-back{
  color:#0066cc;
  text-decoration:none;
  font-size:13px;
}

/* HERO */

.map-hero{
  text-align:center;
  padding:110px 20px 60px;
}

.map-eyebrow{
  color:#777;
  font-size:12px;
  letter-spacing:3px;
  font-weight:600;
}

.map-hero h1{
  font-size:clamp(60px,9vw,120px);
  line-height:.9;
  letter-spacing:-7px;
  margin:20px 0;
}

.map-hero h1 span{
  color:#bf72ff;
}

.map-hero p{
  max-width:650px;
  margin:auto;
  color:#777;
  font-size:20px;
  line-height:1.5;
}

/* MAP */

.map-wrapper{
  max-width:1300px;
  margin:0 auto;
  padding:20px 5% 120px;
}

.map{
  position:relative;
  width:100%;
  overflow:hidden;

  border-radius:28px;

  box-shadow:
    0 25px 70px rgba(0,0,0,.18);

  background:#222;
}

.map img{
  display:block;
  width:100%;
  height:auto;
}

/* MARKERS */

.marker{
  position:absolute;

  width:20px;
  height:20px;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:#bf72ff;
  border:3px solid white;

  box-shadow:
    0 0 0 5px rgba(191,114,255,.25),
    0 5px 15px rgba(0,0,0,.3);

  cursor:pointer;

  transition:
    transform .2s,
    box-shadow .2s;
}

.marker:hover{
  transform:translate(-50%,-50%) scale(1.35);

  box-shadow:
    0 0 0 8px rgba(191,114,255,.2),
    0 5px 20px rgba(0,0,0,.4);
}

/* MARKER POSITIONS */

/* Apple Park */
.apple{
  left:23.2%;
  top:49.6%;
}

/* Pentagon */
.pentagon{
  left:52.8%;
  top:32.3%;
}

/* Airport */
.airport{
  left:66.7%;
  top:28.7%;
}

/* Laboratories */
.labs{
  left:40.3%;
  top:24.6%;
}

/* Sphere */
.sphere{
  left:43.0%;
  top:45.4%;
}

/* Twin Towers */
.towers{
  left:43.3%;
  top:60.1%;
}

/* Falcon Heavy */
.falcon{
  left:22.7%;
  top:87.1%;
}

/* INFO CARD */

.map-info{
  position:absolute;

  left:50%;
  bottom:25px;

  transform:translateX(-50%);

  width:min(90%,420px);

  padding:24px;

  border-radius:22px;

  background:rgba(20,20,25,.88);
  backdrop-filter:blur(20px);

  color:white;

  opacity:0;
  pointer-events:none;

  transition:.25s;

  box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.map-info.active{
  opacity:1;
  pointer-events:auto;
}

.map-info small{
  color:#aaa;
  letter-spacing:2px;
}

.map-info h2{
  margin:6px 0 10px;
  font-size:28px;
}

.map-info p{
  margin:5px 0;
  color:#ccc;
}

.close{
  position:absolute;
  top:15px;
  right:18px;

  cursor:pointer;

  color:#aaa;
  font-size:20px;
}

/* FOOTER */

footer{
  padding:35px 5%;
  border-top:1px solid #ddd;
  color:#777;
  font-size:11px;
}

.footer-inner{
  max-width:1200px;
  margin:auto;

  display:flex;
  justify-content:space-between;
}

@media(max-width:700px){

  .map-hero{
    padding:80px 20px 40px;
  }

  .map-hero h1{
    letter-spacing:-4px;
  }

  .map-wrapper{
    padding-left:15px;
    padding-right:15px;
  }

  .map{
    border-radius:18px;
  }

  .marker{
    width:15px;
    height:15px;
  }

  .footer-inner{
    flex-direction:column;
    gap:15px;
  }

}

</style>
</head>


<body>

<header class="map-nav">

  <a class="map-brand" href="index.html">
     CERASUS
  </a>

  <a class="map-back" href="index.html">
    ← Back to homepage
  </a>

</header>


<main>

<section class="map-hero">

  <div class="map-eyebrow">
    CERASUS · CITY MAP
  </div>

  <h1>
    Explore<br>
    <span>Cerasus.</span>
  </h1>

  <p>
    Explore the major landmarks, infrastructure and
    developments that make up Cerasus on the Rulercraft world.
  </p>

</section>


<section class="map-wrapper">

<div class="map">

  <img
    src="Assets/CerasusAbove.png"
    alt="Aerial map of Cerasus"
  >


  <!-- APPLE PARK -->

  <button
    class="marker apple"
    onclick="showInfo(
      'Apple Park',
      'LANDMARK',
      'X 21400 · Z −6232'
    )">
  </button>


  <!-- PENTAGON -->

  <button
    class="marker pentagon"
    onclick="showInfo(
      'Pentagon',
      'HEADQUARTERS',
      'X 21688 · Z −6350'
    )">
  </button>


  <!-- AIRPORT -->

  <button
    class="marker airport"
    onclick="showInfo(
      'Cerasus Airport',
      'AVIATION',
      'X 21800 · Z −6400'
    )">
  </button>


  <!-- LABORATORIES -->

  <button
    class="marker labs"
    onclick="showInfo(
      'Laboratories',
      'RESEARCH',
      'X 21600 · Z −6400'
    )">
  </button>


  <!-- SPHERE -->

  <button
    class="marker sphere"
    onclick="showInfo(
      'Cerasus Sphere',
      'LANDMARK',
      'X 21600 · Z −6250'
    )">
  </button>


  <!-- TOWERS -->

  <button
    class="marker towers"
    onclick="showInfo(
      'Twin Towers',
      'LANDMARK',
      'X 21600 · Z −6200'
    )">
  </button>


  <!-- FALCON HEAVY -->

  <button
    class="marker falcon"
    onclick="showInfo(
      'Falcon Heavy',
      'SPACEFLIGHT',
      'X 21400 · Z −6000'
    )">
  </button>


  <!-- INFO CARD -->

  <div class="map-info" id="mapInfo">

    <span class="close" onclick="closeInfo()">×</span>

    <small id="infoType">
      LANDMARK
    </small>

    <h2 id="infoTitle">
      Apple Park
    </h2>

    <p id="infoCoordinates">
      X 21400 · Z −6232
    </p>

  </div>

</div>

</section>

</main>


<footer>

  <div class="footer-inner">

    <span>© 2026 Cerasus</span>

    <span>Built on Rulercraft.</span>

  </div>

</footer>


<script>

function showInfo(title,type,coordinates){

  document.getElementById("infoTitle").textContent = title;

  document.getElementById("infoType").textContent = type;

  document.getElementById("infoCoordinates").textContent = coordinates;

  document.getElementById("mapInfo").classList.add("active");

}


function closeInfo(){

  document.getElementById("mapInfo").classList.remove("active");

}

</script>

</body>
</html>
